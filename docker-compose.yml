services:
  zai2api:
    build: .
    container_name: zai2api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - AUTH_TOKEN=d3vin
      - DB_PATH=/app/data/tokens.sqlite
      # - ZAI_TOKEN=
      # - HTTP_PROXY=
      # - HTTPS_PROXY=
    volumes:
      - ./data:/app/data
